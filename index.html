:root{
  --bg:#FAFAF8; --fg:#151512; --muted:#6B6A63; --line:#E4E3DD; --panel:#F1F0EC; --red:#D1262E; --on-red:#FFFFFF;
  --display:"Satoshi","Apple SD Gothic Neo","Hiragino Sans","PingFang SC","Noto Sans CJK KR",system-ui,sans-serif;
  --body:"Satoshi","Apple SD Gothic Neo","Hiragino Sans","PingFang SC","Noto Sans CJK KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121210;--fg:#F4F3EE;--muted:#9C9A92;--line:#2B2A26;--panel:#1B1A17;--red:#E5474E;--on-red:#FFFFFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121210;--fg:#F4F3EE;--muted:#9C9A92;--line:#2B2A26;--panel:#1B1A17;--red:#E5474E;--on-red:#FFFFFF;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-block:0 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.draft{font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-block:10px}
.draft .wrap{padding-block:0}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:28px}
.wm{height:30px;width:auto;color:var(--fg);display:block}
.wm .dot{fill:var(--red)}
select{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
select:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.hero{padding-block:48px 24px;display:grid;gap:22px}
.eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.onair{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;position:relative}
.onair::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--red);opacity:0;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}
h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,6.4vw,58px);line-height:1.08;letter-spacing:-.035em;margin:0;text-wrap:balance}
:lang(ko) h1,:lang(ja) h1,:lang(zh) h1{letter-spacing:-.02em;line-height:1.2}
.lede{font-size:19px;color:var(--muted);max-width:60ch;margin:0}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:500;padding:14px 22px;border-radius:12px}
.btn .d{width:8px;height:8px;border-radius:50%;background:var(--red)}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--fg)}
.first{max-width:60ch;margin:0}
.meta{font-size:13px;color:var(--muted)}
section{padding-block:44px;border-top:1px solid var(--line);display:grid;gap:14px}
h2{font-family:var(--display);font-weight:500;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0;max-width:62ch}
.muted{color:var(--muted)}
/* timeline drawn to scale: 1 s = 1/7 of the track */
.tl{display:grid;gap:14px;margin-top:6px}
.row{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center}
.row .lab{font-size:14px;color:var(--muted)}
.track{position:relative;height:38px;border-radius:10px;background:var(--panel);overflow:hidden;min-width:0}
.seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 10px;font-size:12.5px;white-space:nowrap;overflow:hidden}
.seg.wait{background:repeating-linear-gradient(-45deg,transparent 0 6px,color-mix(in srgb,var(--muted) 18%,transparent) 6px 12px);color:var(--muted)}
.seg.go{color:var(--fg)}
.tick{position:absolute;top:0;bottom:0;width:3px;background:var(--red)}
.axis{display:grid;grid-template-columns:130px 1fr;gap:14px}
.axis .scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:13px}
.states{display:flex;flex-wrap:wrap;gap:12px}
.state{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:0}
.state svg{width:28px;height:28px;color:var(--fg);flex:none}
.state span{font-size:15px}
.bar{display:flex;justify-content:flex-end;align-items:center;gap:16px;height:30px;padding:0 14px;background:var(--panel);border-radius:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar svg{width:20px;height:20px;color:var(--fg)}
.video{aspect-ratio:16/9;max-width:100%;border-radius:14px;background:var(--panel);display:grid;place-items:center;gap:8px;text-align:center;color:var(--muted);font-size:14px;border:1px solid var(--line)}
.video .big{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.video .big::before{content:"";border-left:14px solid var(--red);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
ul.req{margin:0;padding-left:1.1em;display:grid;gap:6px}
.dings{display:grid;grid-template-columns:130px 1fr;gap:10px 14px;align-items:center}
.dings .lab{font-size:14px;color:var(--muted)}
.dl{display:flex;gap:10px;flex-wrap:wrap}
.dl i{width:12px;height:12px;border-radius:50%;background:var(--red)}
.dl i:not(:first-child){opacity:.55}
@media (max-width:520px){.dings{grid-template-columns:1fr}}
.demo{margin:0;display:grid;gap:10px}
.demo video{width:100%;max-width:100%;aspect-ratio:16/9;border-radius:14px;background:var(--panel);display:block;object-fit:cover}
@media (prefers-reduced-motion:reduce){.demo video{animation:none}}
footer{font-size:13px;color:var(--muted);padding-top:28px;border-top:1px solid var(--line)}
@media (max-width:520px){.row,.axis{grid-template-columns:1fr}.axis .pad{display:none}.row .lab{font-size:13px}}
@media (prefers-reduced-motion:reduce){.onair::after{animation:none}}
</style>
</head>

earmic 让连接一直保持，即使在安静的车厢里，一开口就能开始听写。", "cta": "免费下载（测试版）", "cta_meta": "免费 · 0.1 测试版 · macOS 15 及以上 · Apple 芯片和 Intel 均可", "t_title": "每次白白浪费的 5 秒", "t_without": "不用 nearmic", "t_with": "用 nearmic", "t_press": "开始听写", "t_wait": "iPhone 重新连接中", "t_text": "文字开始出现", "t_note": "在 MacBook Pro + Wispr Flow + iPhone 上实测，不同环境会略有差异。", "u_title": "小声说话，也能听得清", "u_body": "把 Shure MV88 这类 USB‑C 麦克风插到 iPhone 上，凑近嘴边说话就行。在咖啡馆、图书馆或火车上，轻声细语就足够了。Mac 会像使用内置麦克风一样接收声音。", "m_title": "菜单栏上的一个圆点，状态一目了然", "m_hold": "正在保持连接", "m_search": "正在寻找 iPhone", "m_pause": "已暂停", "m_body": "nearmic 安静地待在菜单栏里。登录 Mac 后自动启动，iPhone 离开再回到附近时，也会自己重新连上。", "s_title": "iPhone 屏幕尽管关掉", "s_body": "按一下侧边按钮关掉屏幕，麦克风照常工作，也更省电。", "p_title": "不会录音", "p_body": "nearmic 只是让麦克风保持开启，收到的声音会立刻丢弃。不保存、不上传，也不做任何分析。", "r_title": "使用环境", "r1": "运行 macOS 15 Sequoia 或更高版本的 Mac", "r2": "iPhone XR 或更新机型，系统为 iOS 16 或更高版本", "r3": "两台设备登录同一个 Apple 账户，并打开无线局域网和蓝牙", "v_caption": "根据真实应用界面制作的动画：先看菜单栏，再看听写如何立刻开始。", "f_title": "用过之后，欢迎告诉我们感受", "f_body": "这还是早期测试版。如果遇到连接中断或用着不顺手的地方，请告诉我们。如果 nearmic 帮你省下了时间，也欢迎请我们喝杯咖啡。", "foot": "nearmic 与 Apple 公司无关。iPhone 和 Mac 是 Apple Inc. 的商标。", "story_title": "在火车上做出来的", "story_body": "我经常在长途火车上办公。安静的车厢里不好大声说话，我只能压低声音，可单靠 iPhone 的麦克风，这么小的声音根本识别不准。于是我给 iPhone 插上 Shure MV88，再通过连续互通把它当成 Mac 的麦克风来用。声音是收清楚了，但还有两件事一直让我很烦：每次开始听写都要等 5 秒，而且每次都会“叮”一声。nearmic 就是为了解决这两件事而做的。", "chime_title": "提示音，响一次就够了", "chime_body": "Mac 每次重新连上 iPhone 麦克风都会响一声提示音，在安静的车厢里一遍又一遍。有了 nearmic，坐下时只连接一次，之后一直保持，提示音也只会响那一次。", "chime_without": "不用 nearmic", "chime_with": "用 nearmic", "support": "在 Ko‑fi 上请我喝杯咖啡", "first_open": "测试版尚未经过 Apple 公证，第一次打开会被拦下。请前往“系统设置”›“隐私与安全性”，点按“仍要打开”。", "feedback_btn": "反馈问题"}, "de": {"_name": "Deutsch", "draft": "Vorschau-Entwurf — Download- und Feedback-Links sind Platzhalter.", "eyebrow": "Menüleisten-App für den Mac · dein iPhone als Mikrofon", "h1": "Dein iPhone als Mikrofon, jederzeit bereit für den Mac.", "lede": "Sobald du kurz nicht sprichst, trennt macOS das iPhone-Mikrofon nach etwa drei Sekunden. Willst du weiterreden, wartest du rund fünf Sekunden, begleitet von einem Signalton. nearmic hält die Verbindung offen. So beginnt das Diktat, sobald du sprichst, auch im leisen Zugabteil.", "cta": "Kostenlos laden (Beta)", "cta_meta": "Kostenlos · Version 0.1 Beta · ab macOS 15 · Apple Silicon und Intel", "t_title": "Fünf Sekunden, die du jedes Mal verlierst", "t_without": "Ohne nearmic", "t_with": "Mit nearmic", "t_press": "Diktat starten", "t_wait": "iPhone verbindet sich neu", "t_text": "Text erscheint", "t_note": "Gemessen mit MacBook Pro, Wispr Flow und iPhone. Je nach Umgebung kann es etwas abweichen.", "u_title": "Leise sprechen, klar verstanden werden", "u_body": "Steck ein USB‑C-Mikrofon wie das Shure MV88 ans iPhone, halte es nah an den Mund und sprich einfach. Ob im Café, in der Bibliothek oder im Zug: Flüstern genügt. Dein Mac nutzt den Ton wie ein eingebautes Mikrofon.", "m_title": "Ein Punkt in der Menüleiste zeigt dir alles", "m_hold": "Verbindung wird gehalten", "m_search": "Suche dein iPhone", "m_pause": "Pausiert", "m_body": "nearmic sitzt unauffällig in der Menüleiste, startet bei der Anmeldung und verbindet sich von selbst neu, sobald dein iPhone wieder in der Nähe ist.", "s_title": "iPhone-Bildschirm einfach ausschalten", "s_body": "Drück die Seitentaste: Der Bildschirm geht aus, das Mikrofon läuft weiter. Das schont den Akku.", "p_title": "Es wird nichts aufgenommen", "p_body": "nearmic hält das Mikrofon nur offen und verwirft jedes Audiosignal sofort. Nichts wird gespeichert, gesendet oder ausgewertet.", "r_title": "Das brauchst du", "r1": "Einen Mac mit macOS 15 Sequoia oder neuer", "r2": "Ein iPhone XR oder neuer mit iOS 16 oder neuer", "r3": "Beide Geräte mit demselben Apple Account angemeldet, WLAN und Bluetooth eingeschaltet", "v_caption": "Animation nach der echten App: erst die Menüleiste, dann startet das Diktat sofort.", "f_title": "Sag uns, wie es läuft", "f_body": "Das ist eine frühe Beta. Wenn die Verbindung abreißt oder dich etwas stört, schreib uns. Und wenn dir nearmic Zeit spart, freuen wir uns über einen Kaffee.", "foot": "nearmic steht in keiner Verbindung zu Apple. iPhone und Mac sind Marken der Apple Inc.", "story_title": "Entstanden im Zug", "story_body": "Ich arbeite oft auf langen Zugfahrten. Laut diktieren kommt im ruhigen Abteil nicht infrage, also flüstere ich fast. Nur mit dem iPhone-Mikrofon wurde aus so leiser Stimme aber kein brauchbarer Text. Also habe ich ein Shure MV88 ans iPhone gesteckt und es über die Integration als Mac-Mikrofon genutzt. Der Ton war jetzt klar, doch zwei Dinge haben mich weiter gestört: bei jedem Diktatstart fünf Sekunden Wartezeit und jedes Mal ein Signalton. nearmic ist entstanden, um genau das abzustellen.", "chime_title": "Ein Signalton reicht", "chime_body": "Jedes Mal, wenn sich der Mac wieder mit dem iPhone-Mikrofon verbindet, ertönt ein Signal, im stillen Abteil immer wieder. Mit nearmic verbindet sich das iPhone einmal, wenn du dich hinsetzt, und bleibt verbunden. Der Ton kommt also nur dieses eine Mal.", "chime_without": "Ohne nearmic", "chime_with": "Mit nearmic", "support": "Auf Ko‑fi unterstützen", "first_open": "Die Beta ist noch nicht von Apple beglaubigt, deshalb blockiert macOS sie beim ersten Start. Öffne dann Systemeinstellungen › Datenschutz & Sicherheit und klicke auf „Dennoch öffnen“.", "feedback_btn": "Problem melden"}, "fr": {"_name": "Français", "draft": "Aperçu — les liens de téléchargement et de retour sont provisoires.", "eyebrow": "App de barre des menus pour Mac · votre iPhone comme micro", "h1": "Le micro de votre iPhone, toujours prêt pour votre Mac.", "lede": "Dès que vous vous taisez quelques instants, macOS coupe le micro de l’iPhone au bout d’environ trois secondes. Pour reprendre, il faut patienter près de cinq secondes, avec un petit son à chaque fois. nearmic garde la connexion ouverte : la dictée démarre dès que vous parlez, même dans un train silencieux.", "cta": "Télécharger gratuitement (bêta)", "cta_meta": " es d’Apple Inc.", "story_title": "Né dans un train", "story_body": "Je travaille souvent pendant de longs trajets en train. Dans un wagon silencieux, impossible de dicter à voix haute : je chuchote presque. Mais avec le seul micro de l’iPhone, une voix aussi basse était mal transcrite. J’ai donc branché un Shure MV88 sur l’iPhone et je m’en suis servi comme micro du Mac grâce à Continuité. Le son était enfin net, mais deux choses me gênaient encore : cinq secondes d’attente à chaque dictée, et un son de connexion à chaque fois. nearmic est né pour régler ces deux problèmes.", "chime_title": "Un seul « ding », c’est assez", "chime_body": "À chaque reconnexion du micro de l’iPhone, le Mac émet un son, encore et encore dans un wagon silencieux. Avec nearmic, l’iPhone se connecte une seule fois quand vous vous installez, puis reste connecté. Vous n’entendez le son qu’une fois.", "chime_without": "Sans nearmic", "chime_with": "Avec nearmic", "support": "Me soutenir sur Ko‑fi", "first_open": "La bêta n’est pas encore notarisée par Apple : macOS la bloque à la première ouverture. Allez dans Réglages Système › Confidentialité et sécurité, puis cliquez sur « Ouvrir quand même ».", "feedback_btn": "Signaler un problème"}, "es": {"_name": "Español", "draft": "Borrador de vista previa: los enlaces de descarga y comentarios son provisionales.", "eyebrow": "App para la barra de menús del Mac · tu iPhone como micrófono", "h1": "El micrófono de tu iPhone, siempre listo en tu Mac.", "lede": "En cuanto dejas de hablar un momento, macOS desconecta el micrófono del iPhone a los tres segundos. Para volver a hablar tienes que esperar unos cinco segundos, y además suena un aviso. nearmic mantiene la conexión abierta, así que el dictado empieza en cuanto hablas, incluso en un tren en silencio.", "cta": "Descargar gratis (beta)", "cta_meta": "Gratis · versión 0.1 beta · macOS 15 o posterior · Apple silicon e Intel", "t_title": "Los cinco segundos que pierdes cada vez", "t_without": "Sin nea
